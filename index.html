<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1411" media="(prefers-color-scheme: dark)" />
    <script>
      /* Apply a saved theme before first paint to avoid a flash. */
      try { var t = localStorage.getItem('mn-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <title>Maid New | Website Redesign Concept by SitePilot</title>
    <meta
      name="description"
      content="An unofficial website redesign concept for Maid New, a Red Deer, Alberta cleaning company. Prepared by SitePilot as a demonstration only."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
